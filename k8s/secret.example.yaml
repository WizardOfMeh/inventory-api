# Template only. The real Secret is NOT committed — see .gitignore.
#
# Create it imperatively instead:
#
#   kubectl create secret generic inventory-api-secret \
#     --from-literal=DATABASE_URL="postgres://inventory:$PGPASS@10.0.0.20:5432/homelab?sslmode=require" \
#     --from-literal=API_TOKEN="$(openssl rand -hex 32)"
#
# Note that a Kubernetes Secret is base64, not encryption: anyone with read
# access to the namespace can decode it. For anything beyond a homelab, use
# Sealed Secrets, SOPS or an external secrets operator.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-api-secret
  labels:
    app.kubernetes.io/name: inventory-api
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:password@host:5432/homelab?sslmode=require"
  API_TOKEN: "replace-me-openssl-rand-hex-32"
